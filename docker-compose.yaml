# Moxie Ops — production app (Next.js + Chromium for the Tira/Nykaa scrapers).
#
# Works on Coolify (Build Pack: Docker Compose) and locally.
# Database is EXTERNAL (AWS RDS / any managed Postgres) — set DATABASE_URL.
#
# ENV / SECRETS (Coolify → app → Environment Variables; Coolify injects them):
#   - DATABASE_URL  e.g. postgresql://USER:PASS@<rds-endpoint>:5432/moxie_ops?sslmode=require
#   - NEXT_PUBLIC_APP_URL  your public URL (e.g. http://opsportal.toolsmb.in)
#   - plus every other key from .env.local (Resend, WMS, Tira/Nykaa, Zepto, Blinkit, …)
#
# Run a SINGLE replica: the in-process schedulers (Tira 09:00 IST, others every 3h)
# would double-fire if scaled.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # App listens on 3003 (3000 is taken on the host). `next start` honours PORT.
      PORT: "3003"
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
    # Coolify routes your configured domain to this exposed port (Traefik). For raw
    # host access instead, add a `ports: ["3003:3003"]` mapping.
    expose:
      - "3003"
    volumes:
      # Persist the Tira PO PDF cache across restarts.
      - podoc:/app/.po-doc-cache

volumes:
  podoc:
