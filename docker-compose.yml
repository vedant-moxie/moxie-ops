# Moxie Ops — production stack: Postgres + the Next.js app (with Chromium for scrapers).
#
#   docker compose up -d --build
#
# Secrets/integration creds are read from .env.local (gitignored). DATABASE_URL and
# NEXT_PUBLIC_APP_URL are set here and OVERRIDE anything in .env.local so the app
# talks to the `db` container, not a local Postgres.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moxie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moxie}
      POSTGRES_DB: ${POSTGRES_DB:-moxie_ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moxie} -d ${POSTGRES_DB:-moxie_ops}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Integration secrets (Resend, WMS, Tira/Nykaa creds, etc.). Must exist on the host.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      # Point the app at the db service; overrides DATABASE_URL from .env.local.
      DATABASE_URL: postgresql://${POSTGRES_USER:-moxie}:${POSTGRES_PASSWORD:-moxie}@db:5432/${POSTGRES_DB:-moxie_ops}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Persist the Tira PO PDF cache across restarts.
      - podoc:/app/.po-doc-cache

volumes:
  pgdata:
  podoc:
